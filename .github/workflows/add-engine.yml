name: Add VirtualApp engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch VirtualApp engine and apply changes
        run: |
          set -e
          git clone --depth 1 https://github.com/asLody/VirtualApp /tmp/va
          cp -r /tmp/va/VirtualApp/lib ./lib
          sed -i 's/^\(\s*\)package="com.lody.virtual">/\1>/' lib/src/main/AndroidManifest.xml
          tar xzf engine-files.tgz
          rm engine-files.tgz

      - name: Push to branch engine-integration
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b engine-integration
          git add -A
          git commit -m "Add VirtualApp engine"
          git push -f origin engine-integration
