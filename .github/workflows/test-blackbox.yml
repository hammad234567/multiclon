name: Test BlackBox engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK 29
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0"

      - name: Get BlackBox source
        run: git clone --depth 1 https://github.com/ALEX5402/NewBlackbox src

      - name: Build demo app
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-test-apk
          path: src/app/build/outputs/apk/debug/*.apk
